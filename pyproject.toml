[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-event-streaming-state"
version = "0.1.0"
description = "A Kafka-to-Redis market event pipeline with replay-safe state updates."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "kafka-python>=2.2,<3",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
